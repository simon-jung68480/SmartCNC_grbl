<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('smartcnc_app_preferences_v1');
          var theme = raw ? JSON.parse(raw).theme : 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCNC — Contrôleur CNC GRBL 1.1 (Arduino Uno + CNC Shield V3.0)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b0f17] text-slate-100 antialiased selection:bg-sky-400/30 selection:text-sky-100 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
